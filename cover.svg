  <rect x="140" y="298" width="920" height="5" fill="#231f1c"/>
  <text x="140" y="372" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="40" font-weight="800" fill="#231f1c">最划算 <tspan fill="#a8432f">30 斤</tspan> · 最不后悔 <tspan fill="#a8432f">21 斤</tspan> · 亏得起 <tspan fill="#a8432f">17 斤</tspan></text>
  <text x="140" y="420" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" fill="#58514b">囤满 30 斤：涨回去省 27.55 元，不变亏 4.95 元，再跌亏 26.2 元</text>
